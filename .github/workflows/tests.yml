# Runs the test suite on every push and pull request.
#
# windows-latest rather than ubuntu, for two reasons. The suite drives real processes and reads
# real compiler output, and most of what it knows about - MSVC, the dotnet host, Windows path
# handling, DPAPI - only exists here. The runner image also ships Visual Studio, a JDK and
# Python, so the C, C++, Java and Python paths are genuinely exercised rather than skipped.
#
# Only FixFinder.Tests and the Core project it references are built. FixFinder.Gui is WPF and
# has no tests of its own; leaving it out keeps the job honest about what it is checking.

name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: dotnet test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # 8 is what the projects target. 10 is what runs a lone Program.cs with `dotnet run`, which is
      # how FixFinder launches a single C# file - without it the live C# construct cases return early
      # and count as passes. With both installed, 10 does the building; it builds net8.0 as before.
      - name: Set up .NET 8 and 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Built once so the sample's own assembly and portable PDB exist. One test reads that PDB
      # to prove source-root detection works against a real one rather than a hand-made file,
      # and quietly returns early when it is absent - which would make it look like it passed.
      - name: Build the .NET sample target
        run: dotnet build TestTargets/CrashDotNet/CrashDotNet.csproj -c Debug --nologo

      - name: Restore
        run: dotnet restore FixFinder.Tests/FixFinder.Tests.csproj

      - name: Build
        run: dotnet build FixFinder.Tests/FixFinder.Tests.csproj -c Release --no-restore --nologo

      # The command line's behaviour is all in Core and tested there, but nothing else builds its own few lines -
      # and a command that no longer compiles is a broken editor integration nobody would notice until they used it.
      - name: Build the command line
        run: dotnet build FixFinder.Cli/FixFinder.Cli.csproj -c Release --nologo

      # The tests that run a class of JUnit tests need JUnit itself, and the test of a program that uses
      # Lombok needs Lombok; no runner image has either. They are fetched here, before the tests start,
      # from Maven Central, and checked against the SHA-1 Maven Central publishes beside each jar. The
      # tests find them through FIXFINDER_JUNIT_JARS and FIXFINDER_LOMBOK_JAR, and return early without
      # them, as the tests that need a missing compiler do.
      - name: Fetch JUnit and Lombok for the tests that use them
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP "junit"
          New-Item -ItemType Directory -Force -Path $folder | Out-Null

          $jars = @(
            "org/junit/platform/junit-platform-console-standalone/1.11.4/junit-platform-console-standalone-1.11.4.jar",
            "junit/junit/4.13.2/junit-4.13.2.jar",
            "org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar",
            "org/projectlombok/lombok/1.18.48/lombok-1.18.48.jar"
          )

          foreach ($jar in $jars) {
            $url = "https://repo1.maven.org/maven2/$jar"
            $file = Join-Path $folder (Split-Path $jar -Leaf)
            Invoke-WebRequest -Uri $url -OutFile $file
            Invoke-WebRequest -Uri "$url.sha1" -OutFile "$file.sha1"

            $published = (Get-Content "$file.sha1" -Raw).Trim().Split(' ')[0].ToUpperInvariant()
            $downloaded = (Get-FileHash $file -Algorithm SHA1).Hash
            if ($published -ne $downloaded) { throw "$jar does not match the SHA-1 Maven Central publishes for it" }
            Remove-Item "$file.sha1"
          }

          # Lombok is moved out of the JUnit folder, so the tests that run JUnit see only what they did before.
          $lombok = Join-Path $env:RUNNER_TEMP "lombok"
          New-Item -ItemType Directory -Force -Path $lombok | Out-Null
          Move-Item (Join-Path $folder "lombok-1.18.48.jar") $lombok

          "FIXFINDER_JUNIT_JARS=$folder" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FIXFINDER_LOMBOK_JAR=$(Join-Path $lombok 'lombok-1.18.48.jar')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # The tests of pytest files need pytest, and the test of a notebook that draws a plotly chart needs plotly; no runner
      # image has either. They are installed into an environment of their own, made for the tests and used by nothing else,
      # so the runner's own Python stays as it came. Each package - dependencies included - is pinned to one version and to
      # the SHA-256 PyPI publishes for its wheel, and pip refuses anything that does not match. The tests find it through
      # FIXFINDER_TEST_PACKAGES_PYTHON, and return early without it.
      - name: Install pytest and plotly for the tests that use them
        shell: pwsh
        run: |
          $pinned = @(
            "colorama==0.4.6 --hash=sha256:4f1d9991f5acc0ca119f9d443620b77f9d6b33703e51011c16baf57afb285fc6",
            "iniconfig==2.3.0 --hash=sha256:f631c04d2c48c52b84d0d0549c99ff3859c98df65b3101406327ecc7d53fbf12",
            "narwhals==2.26.0 --hash=sha256:29326d74f107c347fd1009bd58e38d9f7c7c5b51e6de97bc93dbc325d9038b54",
            "packaging==26.3 --hash=sha256:d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c",
            "plotly==7.1.0 --hash=sha256:dbb7fa18afce40d0a8e80d1bf162eceb3faa0ce5a77fe741ad09a74cf78f53f3",
            "pluggy==1.6.0 --hash=sha256:e920276dd6813095e9377c0bc5566d94c932c33b27a3e3945d8389c374dd4746",
            "pygments==2.21.0 --hash=sha256:2363c69b61c4a97c838da3b130dcd6468f4848992b21a82f2a63ec34377137d9",
            "pytest==9.1.1 --hash=sha256:37a86b45efb9a47a61a36449063e8e18d0cab3161329fc099eb21783169c4f0c"
          )

          $requirements = Join-Path $env:RUNNER_TEMP "test-packages.txt"
          $pinned | Set-Content -Path $requirements -Encoding utf8

          $environment = Join-Path $env:RUNNER_TEMP "test-packages"
          python -m venv $environment
          $python = Join-Path $environment "Scripts\python.exe"

          & $python -m pip install --quiet --no-deps --require-hashes --only-binary=:all: -r $requirements
          if ($LASTEXITCODE -ne 0) { throw "pip could not install the pinned test packages" }

          "FIXFINDER_TEST_PACKAGES_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # No network access is needed or wanted: searches run against recorded responses through a
      # handler that throws on anything unrecorded, so a test cannot quietly reach the internet.
      - name: Test
        run: >
          dotnet test FixFinder.Tests/FixFinder.Tests.csproj -c Release --no-build --nologo
          --verbosity normal
          --logger "trx;LogFileName=results.trx"
          --results-directory TestResults

      # The count is read from the TRX rather than scraped from console output, which would
      # break the first time the wording of "Passed! - Failed: 0, Passed: 322" changed.
      #
      # Committed back to the branch so the badge reads a file in this repository instead of a
      # gist, which would need a personal token. Only written when the number actually changes,
      # and marked [skip ci] so the push does not start another run of this workflow.
      # Runs for a push to main and for a manual dispatch, but never for a pull request, which
      # has nothing to write to and may come from a fork with no permission to try.
      - name: Publish the test count for the badge
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $trx = Get-ChildItem TestResults -Filter *.trx -Recurse | Select-Object -First 1
          if (-not $trx) { Write-Host "no trx produced - leaving the badge alone"; exit 0 }

          $counters = ([xml](Get-Content $trx.FullName)).TestRun.ResultSummary.Counters
          $total  = [int]$counters.total
          $failed = [int]$counters.failed

          $message = if ($failed -gt 0) { "$failed failing of $total" } else { "$total passing" }
          $colour  = if ($failed -gt 0) { "red" } else { "brightgreen" }

          $badge = [ordered]@{
            schemaVersion = 1
            label         = "tests"
            message       = $message
            color         = $colour
          }

          New-Item -ItemType Directory -Force -Path .github/badges | Out-Null
          $badge | ConvertTo-Json | Set-Content .github/badges/tests.json -Encoding utf8

          if (-not (git status --porcelain .github/badges/tests.json)) {
            Write-Host "count unchanged at $message - nothing to commit"
            exit 0
          }

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/tests.json
          git commit -m "Update the test count badge to $message [skip ci]"
          git push

      - name: Report which toolchains the runner had
        if: always()
        shell: pwsh
        run: |
          # Several tests return early when a compiler is missing, so it is worth recording what
          # was actually available - a green run with everything skipped is not a green run.
          foreach ($tool in 'dotnet', 'python', 'javac', 'java', 'gcc', 'clang', 'node', 'go') {
            $found = (Get-Command $tool -ErrorAction SilentlyContinue).Source
            Write-Host ("{0,-8} {1}" -f $tool, $(if ($found) { $found } else { 'not present' }))
          }

          # Node's and Go's versions decide their wording - Node's module detection, Go's compiler messages - and so
          # which JavaScript and Go cases have anything to fix.
          if (Get-Command node -ErrorAction SilentlyContinue) {
            Write-Host ("{0,-8} {1}" -f 'node ver', (& node --version))
          }
          if (Get-Command go -ErrorAction SilentlyContinue) {
            Write-Host ("{0,-8} {1}" -f 'go ver', (& go version))
          }

          # The SDK that `dotnet` resolves to decides whether a lone .cs file can be run at all.
          if (Get-Command dotnet -ErrorAction SilentlyContinue) {
            Write-Host ("{0,-8} {1}" -f 'sdk ver', (& dotnet --version))
          }

          # The tests of pytest files run with the pytest installed for them; without it they return early.
          if ($env:FIXFINDER_TEST_PACKAGES_PYTHON -and (Test-Path $env:FIXFINDER_TEST_PACKAGES_PYTHON)) {
            Write-Host ("{0,-8} {1}" -f 'pytest', (& $env:FIXFINDER_TEST_PACKAGES_PYTHON -m pytest --version))
          } else {
            Write-Host ("{0,-8} {1}" -f 'pytest', 'not present')
          }

          # gcc's version matters as much as its presence. The build prefers gcc to MSVC when it is on
          # PATH, and gcc 15 defaults to C23 - where bool is a keyword and a missing <stdbool.h> is not
          # an error at all - so which C cases have anything to fix depends on it.
          if (Get-Command gcc -ErrorAction SilentlyContinue) {
            Write-Host ("{0,-8} {1}" -f 'gcc ver', (& gcc -dumpfullversion))
          }

          $vs = Get-ChildItem 'C:\Program Files*\Microsoft Visual Studio\*\*\VC\Auxiliary\Build\vcvarsall.bat' -ErrorAction SilentlyContinue |
                Select-Object -First 1
          Write-Host ("{0,-8} {1}" -f 'MSVC', $(if ($vs) { $vs.FullName } else { 'not present' }))
